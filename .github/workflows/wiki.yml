# Publishes docs/wiki/ to the GitHub wiki of this repository.
#
# DRAFT: it only runs when started by hand (Actions → Publish wiki → Run workflow).
# To publish automatically on every change to docs/wiki/ on main, uncomment the `push` trigger.
#
# Before the first run:
#   1. Enable the wiki (Settings → General → Features → Wikis).
#   2. Create any first page in the web interface, so the wiki repository
#      (<repo>.wiki.git) exists. This workflow replaces it on its first run.
#   3. Settings → Actions → General → Workflow permissions: "Read and write permissions"
#      (or keep the `permissions` block below, which asks for contents: write).
#
# docs/wiki/ is the canonical source: pages edited directly in the GitHub wiki are
# overwritten by the next run.
name: Publish wiki

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["docs/wiki/**"]

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check wiki links
        # every [text](Page) link must name a page in docs/wiki/, every image must exist
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "docs/wiki"
          pages = {f[:-3] for f in os.listdir(root) if f.endswith(".md")}
          bad = []
          for f in sorted(os.listdir(root)):
              if not f.endswith(".md"):
                  continue
              text = open(os.path.join(root, f), encoding="utf-8").read()
              for target in re.findall(r"\]\(([^)\s]+)\)", text):
                  if re.match(r"^(https?:|mailto:|#)", target):
                      continue
                  page = target.split("#")[0]
                  if page.startswith("images/"):
                      if not os.path.exists(os.path.join(root, page)):
                          bad.append("%s: missing image %s" % (f, page))
                  elif page not in pages:
                      bad.append("%s: unknown page %s" % (f, target))
          print("\n".join(bad) or "all links ok")
          sys.exit(1 if bad else 0)
          PY

      - name: Check out the wiki
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Copy docs/wiki into the wiki
        run: |
          rsync -a --delete --exclude ".git" docs/wiki/ wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git commit -m "Update wiki from ${GITHUB_SHA::7} (docs/wiki)"
          git push origin HEAD
