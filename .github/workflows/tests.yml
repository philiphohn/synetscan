name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # DSM 7 ships Python 3.8; newer Ubuntu runners no longer offer it
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and security tests
        run: python -m unittest discover -s tests -v
